tags:
  -  Contact
summary: Create contact 
operationId: postContact
description: Create contact
security:
- bearerAuth: []

requestBody: 
  content: 
    multipart/form-data:
      schema: 
        type: object
        required: 
          -  name
          -  phoneNumber
          -  email
          -  contactType

        properties: 
          name: 
            type: string
            description: Contact name
            example: Anna Dark
          phoneNumber:
            type: string
            description: Phone contact
            example: '+3802340054456'
          email:
            type: string
            description: Contact email
            example: anna@gmail.com
          isFavourite:
            type: boolean
            description: Contact is favourite
            default: false
            example: true
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'home', 'personal']
            default: "personal"
            example: work
          photo:
            type: string
            format: binary
            description: Contact photo
            default: null  
responses:
  '201':            
    description: Successfully created a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact! 
            data:
              type: object
              $ref: "../../components/schemas/contact.yaml"
  '400':
    $ref:  ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml  
  