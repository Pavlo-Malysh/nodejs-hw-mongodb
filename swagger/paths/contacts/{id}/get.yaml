tags:
  -  Contact
summary: Get contact by id
operationId: getContact
description: Get contact by id
security:
- bearerAuth: []
parameters:
  - in: path   
    name: id
    required: true
    schema:
      type: string
      example: 68efd41636a23320bb4ef586

responses:
  '200':            
    description: Successfully found contact with id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 
            data:
              type: object
              $ref: "../../../components/schemas/contact.yaml"
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml  
  